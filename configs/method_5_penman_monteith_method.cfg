# ==========================================================================================
# method_5_penman_monteith_method.cfg
#
# PET BMI configuration, method 5: Penman-Monteith method.
#
# All six method configuration files share one layout:
#   1. control     identical keys in all six files
#   2. time        identical keys in all six files
#   3. site        identical keys in all six files
#   4. method      the parameters of this method
#
# Format: key = value, one per line. '#' starts a comment anywhere on a line.
# Numeric values may carry a trailing units annotation in brackets, e.g. 3600 [s].
# Relative paths are relative to the repository root, where the test scripts run.
# PET ignores keys it does not read, so the test drivers can keep their keys here too.
# ==========================================================================================

# ---------------- 1. control ----------------
pet_method = 5                              # 1 radiation balance, 2 aerodynamic, 3 combination, 4 Priestley-Taylor, 5 Penman-Monteith, 6 Ball-Berry
verbose = 0                                 # 0 quiet; 1 to 3 print progressively more diagnostics
forcing_file = BMI                          # BMI: forcing passed with set_value. A CSV path: PET reads the forcing itself (methods 1-5 only)
forcing_csv_file = ./forcing/unit_test_forcing.csv   # the test drivers read this file; the BMI drivers pass its values with set_value
run_unit_tests = 0                          # 1: finalize prints the methods 1-5 unit test results next to their expected values
yes_aorc = 1                                # 1: forcing variables are AORC

# ---------------- 2. time ----------------
time_step_size_s = 3600                     # model time step [s]
num_timesteps = 1                           # number of forcing time steps the drivers run

# ---------------- 3. site ----------------
latitude_degrees = 37.865211                # methods 1-5: solar geometry; method 6: only the sign (hemisphere of the monthly LAI and SAI table)
longitude_degrees = -98.12345               # methods 1-5: solar geometry
site_elevation_m = 303.333                  # methods 1-5: pressure and radiation calculations

# ---------------- 4. method parameters (the same keys and values for methods 1-5) ----------------
wind_speed_measurement_height_m = 10.0      # height of the wind speed forcing above ground
humidity_measurement_height_m = 2.0         # height of the humidity and air temperature forcing above ground
vegetation_height_m = 0.12
zero_plane_displacement_height_m = 0.0003   # values <= 0 are replaced by 0.01 m
momentum_transfer_roughness_length_m = 0.0  # if either roughness length is < 1e-6 m, both are set to 1.0 m (ratio 1)
heat_transfer_roughness_length_m = 0.0
surface_longwave_emissivity = 1.0
surface_shortwave_albedo = 0.22
shortwave_radiation_provided = 0            # 1: use the shortwave forcing; 0: compute shortwave from solar geometry (calculate_solar_radiation)
