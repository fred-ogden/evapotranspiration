# ==========================================================================================
# ball_berry_noahmp_cat-18560.cfg
#
# PET BMI configuration, method 6 (Ball-Berry, Noah-MP physics), for the decoupled Noah-MP stack
# on NextGen catchment cat-18560 (eastern Connecticut, USGS vegetation type 11 deciduous
# broadleaf forest, soil color 4): Ball-Berry + CIESM + NoahMP_snow_ablation + the sft-c
# Noah-MP column + CFE3.1. Vegetation values are the USGS type 11 column of NOM_MPTABLE.TBL;
# site values from cat-18560.input. Same layout as configs/method_6_ball_berry.cfg, plus the
# options of 10/26 (section 4, "Noah-MP options for the decoupled stack").
# Noah-MP variable names are given in brackets.
# ==========================================================================================

# ---------------- 1. control ----------------
pet_method = 6                              # 1 radiation balance, 2 aerodynamic, 3 combination, 4 Priestley-Taylor, 5 Penman-Monteith, 6 Ball-Berry
verbose = 0                                 # 0 quiet; 1 to 3 print progressively more diagnostics
forcing_file = BMI                          # BMI: forcing passed with set_value. A CSV path: PET reads the forcing itself (methods 1-5 only)
forcing_csv_file = ./forcing/ball_berry_forcing.csv   # not used by the coupled driver
run_unit_tests = 0                          # 1: finalize prints the methods 1-5 unit test results next to their expected values
yes_aorc = 1                                # 1: forcing variables are AORC

# ---------------- 2. time ----------------
time_step_size_s = 3600                     # model time step [s]
num_timesteps = 1                           # number of forcing time steps the drivers run

# ---------------- 3. site ----------------
latitude_degrees = 41.82454248939527          # [lat] solar geometry (solar_geometry_option = 1) and LAI/SAI hemisphere
longitude_degrees = -72.04918131641683        # [lon] solar geometry
site_elevation_m = 303.333                  # methods 1-5: pressure and radiation calculations

# ---------------- 4. method: method 6 solver selection (C only; the Fortran is always Noah-MP) ----------------
bb_noahmp_exact_iteration = 1               # 1: VEGE_FLUX loop1 replica (fast, matches NWM); 0: nested Picard/Newton solver
bb_noahmp_compatibility = 1                 # 1: freeze stomata at the first iteration, as VEGE_FLUX does (nested solver only)
# Optional diagnostic files, off when the keys are absent (the Fortran comparison script sets them):
# bb_iteration_trace_file = ./output/C/c_canopy_iteration_trace_exact.csv   # per-iteration trace, exact solver only
# bb_diagnostic_summary_file = ./output/C/c_summary.csv                      # solution summary of the last update (Noah-MP names)
# nested solver controls (ignored by the exact solver)
bb_maximum_stability_iterations = 40
bb_maximum_canopy_iterations = 60
bb_stability_relative_tolerance = 1.0e-5
bb_canopy_temperature_tolerance_k = 1.0e-5
bb_maximum_temperature_step_k = 100.0

# ---------------- 4. method: Noah-MP options (both codes) ----------------
usgs_vegetation_type = 11                   # [VEGTYP] deciduous broadleaf forest; recorded only
radiation_transfer_option = 3               # [OPT_RAD] NWM uses 3 (gap = 1 - FVEG); C supports only 3

# ---------------- 4. method: radiation geometry and shortwave split ----------------
cosine_solar_zenith_angle = 0.65            # [COSZ] not used with solar_geometry_option = 1
direct_shortwave_fraction = 0.7             # Noah-MP ATM hard-codes 0.7
visible_shortwave_fraction = 0.5            # Noah-MP ATM hard-codes 0.5
# snow-free soil albedos [ALBSOD, ALBSOI], imposed instead of computed from soil color and soil moisture;
# the ground albedo is soil*(1-FSNO) + snow*FSNO, as in GROUNDALB
soil_albedo_direct_visible = 0.15           # [ALBSOD(1)]
soil_albedo_direct_nir = 0.25               # [ALBSOD(2)]
soil_albedo_diffuse_visible = 0.15          # [ALBSOI(1)]
soil_albedo_diffuse_nir = 0.25              # [ALBSOI(2)]

# ---------------- 4. method: canopy structure ----------------
canopy_top_height_m = 16.0                  # [HVT]; ZPD = 0.65*HVT
canopy_bottom_height_m = 11.5               # [HVB] snow burial of the canopy
tree_crown_radius_m = 1.40                  # [RC] Fortran only, used only with radiation_transfer_option = 1
momentum_roughness_length_m = 0.80          # [Z0MVT]; Noah-MP sets Z0H = Z0M, Z0MG = Z0HG = 0.002 m (bare soil)
characteristic_leaf_dimension_m = 0.04      # [DLEAF]
leaf_orientation_index = 0.25               # [XL]
canopy_wind_parameter = 0.67                # [CWPVT] initial value of BMI variable CWP
green_vegetation_fraction = 0.80            # [FVEG] = SHDFAC; initial value of BMI variable SHDFAC
forcing_height_above_canopy_top_m = 10.0    # [ZREF] cat-18560.input; ZLVL = max(ZPD,HVT) + ZREF

# leaf and stem area index
# 1: monthly table below [LAIM, SAIM], interpolated to the forcing date as PHENOLOGY does (DVEG = 4).
#    In C this overwrites the BMI variables LAI and SAI every time step.
# 0: use leaf_area_index and stem_area_index; in C these are only the initial values of the
#    BMI variables LAI and SAI, which a coupled model (NOM, data assimilation) may then set.
use_monthly_lai_sai_table = 1
lai_sai_at_end_of_step = 0                  # FLO 10/27: 1 the table dated at start of step + DT (NOM); 0 at the BMI time inputs
leaf_area_index = 4.3                       # [LAI] used only when use_monthly_lai_sai_table = 0
stem_area_index = 0.545082                  # [SAI] used only when use_monthly_lai_sai_table = 0
lai_month_01 = 0.0
lai_month_02 = 0.0
lai_month_03 = 0.3
lai_month_04 = 1.2
lai_month_05 = 3.0
lai_month_06 = 4.7
lai_month_07 = 4.5
lai_month_08 = 3.4
lai_month_09 = 1.2
lai_month_10 = 0.3
lai_month_11 = 0.0
lai_month_12 = 0.0
sai_month_01 = 0.4
sai_month_02 = 0.4
sai_month_03 = 0.4
sai_month_04 = 0.4
sai_month_05 = 0.4
sai_month_06 = 0.4
sai_month_07 = 0.9
sai_month_08 = 1.2
sai_month_09 = 1.6
sai_month_10 = 1.4
sai_month_11 = 0.6
sai_month_12 = 0.4

# ---------------- 4. method: leaf and stem optical properties [RHOL RHOS TAUL TAUS] ----------------
leaf_reflectance_visible = 0.10
leaf_reflectance_nir = 0.45
stem_reflectance_visible = 0.16
stem_reflectance_nir = 0.39
leaf_transmittance_visible = 0.05
leaf_transmittance_nir = 0.25
stem_transmittance_visible = 0.001
stem_transmittance_nir = 0.001

# ---------------- 4. method: emissivity ----------------
soil_emissivity = 0.97                      # [EG(1)]; EMV is computed as 1 - exp(-(ELAI+ESAI))

# ---------------- 4. method: Ball-Berry photosynthesis and stomata ----------------
c3_photosynthesis_flag = 1.0                # [C3PSN] 1 = C3, 0 = C4
co2_michaelis_menten_constant_25c_pa = 30.0 # [KC25]
q10_for_kc25 = 2.1                          # [AKC]
o2_michaelis_menten_constant_25c_pa = 30000.0 # [KO25]
q10_for_ko25 = 1.2                          # [AKO]
maximum_carboxylation_rate_25c_umol_per_m2_per_s = 60.0  # [VCMX25] initial value of BMI variable VCMX25
q10_for_vcmx25 = 2.4                        # [AVCMX]
minimum_leaf_conductance_umol_per_m2_per_s = 2000.0      # [BP]
conductance_photosynthesis_slope = 9.0      # [MP] initial value of BMI variable MP
quantum_efficiency_25c = 0.06               # [QE25]
foliage_nitrogen_at_saturation_percent = 1.5 # [FOLNMX]
foliage_nitrogen_percent = 1.0              # [FOLN] NWM driver value
minimum_temperature_for_photosynthesis_k = 273.0         # [TMIN] sets IGS
co2_mole_fraction = 395.0e-06               # [CO2]; CO2AIR = CO2*SFCPRS (Pa)
o2_mole_fraction = 0.209                    # [O2];  O2AIR  = O2*SFCPRS (Pa)

# ---------------- 4. method: coupling inputs ----------------
# In C these keys are the initial values of the BMI input variables of the same names; a coupled
# model then supplies them with set_value. The Fortran reference uses them as imposed values.
root_stress_factor_0_to_1 = 1.0             # [BTRAN] from the hydrologic model; 1 = unstressed (potential) transpiration
surface_resistance_s_per_m = 100.0          # [RSURF] from bare soil evaporation (Sakaguchi-Zeng); imposed here
snow_cover_fraction = 0.0                   # [FSNO] from the snow module
snow_depth_m = 0.0                          # [SNOWH] from the snow module
snow_albedo_direct_visible = 0.0            # [ALBSND(1)] from the snow module (0 at night)
snow_albedo_direct_nir = 0.0                # [ALBSND(2)]
snow_albedo_diffuse_visible = 0.0           # [ALBSNI(1)]
snow_albedo_diffuse_nir = 0.0               # [ALBSNI(2)]
canopy_wetted_fraction = 0.0                # [FWET] from the canopy interception module (CIESM)
canopy_liquid_water_mm = 0.0                # [CANLIQ] from CIESM
canopy_ice_mm = 0.0                         # [CANICE] from CIESM
precipitation_advected_heat_to_canopy_W_per_m2 = 0.0   # [PAHV] from CIESM canopy_interception; enters the canopy energy balance

# ---------------- 4. method: ground boundary conditions ----------------
ground_temperature_offset_from_air_k = 1.0  # [TG] = TMP + offset. Fortran: always. C: until ground_skin_temperature_K is set through BMI
ground_surface_relative_humidity = 1.0      # [RHSUR] Fortran only: enters the ground flux EVG, not the canopy solution

# ---------------- 4. method: initial canopy state (prognostic in Noah-MP) ----------------
# 1: TV = TAH = TMP and EAH = air vapor pressure from SPFH and PRES (cold start)
# 0: use the three values below
initialize_canopy_state_from_forcing = 1
initial_vegetation_temperature_k = 285.3    # [TV]
initial_canopy_air_temperature_k = 285.3    # [TAH]
initial_canopy_air_vapor_pressure_pa = 1410.0 # [EAH]
# 1: TV, TAH and EAH at the end of each step are the next step's start (Noah-MP prognostic state), also
#    exposed as the BMI inputs *_start_of_step_*; 0: every step cold-starts as above
carry_canopy_state_between_steps = 1

# ---------------- 4. method: canopy energy physics ----------------
# 1: Noah-MP (no canopy heat capacity, no canopy phase change in the energy balance, transpiration at
#    any TV); the only option of the exact solver.
# 2: revised (nested solver, bb_noahmp_exact_iteration = 0, and carry_canopy_state_between_steps = 1):
#    canopy biomass heat capacity, fusion of intercepted water inside the energy balance (supplies
#    canopy_freezing_rate_mm_per_s to CIESM canopy_storage), transpiration ramped to 0 below TFRZ.
#    See configs/ball_berry_revised_canopy_energy.cfg. The three keys below are read only by option 2.
canopy_energy_physics_option = 1
canopy_heat_capacity_per_unit_area_index_J_per_m2_per_K = 1000.0  # leaf dry matter + leaf water per unit ELAI+ESAI
canopy_phase_change_window_k = 0.25           # liquid fraction of intercepted water = 0.5*(1+tanh((TV-TFRZ)/w))
frozen_transpiration_ramp_k = 1.0             # transpiration conductance 98 percent open at TFRZ, 2 percent at TFRZ-1 K

# ---------------- 4. method: Noah-MP options for the decoupled stack (FLO 10/26) ----------------
solar_geometry_option = 1                   # 1: COSZ from the BMI time inputs and the site (Noah-MP calc_declin)
solar_geometry_at_end_of_step = 1           # COSZ at start of step + DT, as NOM UtilitiesMain
terrain_slope_degrees = 0.0                 # NWM (flat); NOM uses 1.8344201574906245 for cat-18560
terrain_azimuth_degrees = 177.52247098994906
dynamic_vegetation_option = 1               # DVEG = 1: FVEG = SHDFAC (at least 0.05); 0 without exposed canopy
surface_resistance_snow_blend_option = 1    # OPT_RSF = 4: RSURF blended with RSURF_SNOW by FSNO
surface_resistance_snow_s_per_m = 50.0      # [RSURF_SNOW] NOM_MPTABLE.TBL
soil_albedo_option = 1                      # GROUNDALB from SMC(1) (input soil_top_disc_moisture_content)
soil_top_disc_moisture_content = 0.30       # [SMC(1)] initial value of the BMI input (hydrologic model)
soil_albedo_saturated_visible = 0.09        # [ALBSAT] soil color 4
soil_albedo_saturated_nir = 0.18
soil_albedo_dry_visible = 0.18              # [ALBDRY] soil color 4
soil_albedo_dry_nir = 0.36
